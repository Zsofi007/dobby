[project]
name = "dobby-tools"
version = "0.1.0"
description = "Pluggable tool definitions for Dobby"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["dobby_tools*"]
