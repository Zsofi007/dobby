services:
  postgres:
    image: postgres:16-alpine
    container_name: dobby-postgres
    restart: unless-stopped
    ports:
      # Use 5433 to avoid conflict with a local Postgres on 5432 (Homebrew, etc.)
      - "5433:5432"
    environment:
      POSTGRES_USER: dobby
      POSTGRES_PASSWORD: dobby
      POSTGRES_DB: dobby
    volumes:
      - dobby_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dobby -d dobby"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dobby_pg_data:
